name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # cho phép bấm "Run workflow" thủ công trong tab Actions
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# chỉ chạy 1 deploy tại một thời điểm, hủy các job đang chờ nếu có push mới
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # toàn bộ repo là site tĩnh, không có bước build
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
